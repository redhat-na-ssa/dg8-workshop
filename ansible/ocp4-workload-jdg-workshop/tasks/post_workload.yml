---

# Implement your Post Workload deployment tasks here
- name: Output workshop info
  ansible.builtin.debug:
    msg:
      - "Red Hat DG Workshop provisioned for {{ num_users }} user(s)"
      - "[Attendees]"
      - "Workshop URL for attendees: https://get-a-username-guides.{{ route_subdomain }}"
      - ""
      - "[Instructor Only]"
      - "Admin page for user registration: https://get-a-username-guides.{{ route_subdomain }}/admin"
      - "Admin login with: 'admin'/'{{ workshop_openshift_user_password }}'"
      - "OpenShift Console: {{ console_url }}"
      - "Admin login with: '{{ ocp_username }}'/'r3dh4t1!'"
  when: not silent|bool

# Leave this as the last task in the playbook.
- name: Post_workload tasks complete
  ansible.builtin.debug:
    msg: "Post-Workload Tasks completed successfully."
  when: not silent | bool
